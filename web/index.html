<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is added at boot for a home-screen install only. In a browser tab
         it pushes the layout viewport under the browser's own toolbars, which leaves the app
         short of the bottom edge and exposes a strip of chrome the page cannot paint. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Manage Minecraft servers, files, mods, schedules, nodes, and runtime health with serverSENTINEL." />
    <!-- Mobile browsers paint their toolbars in the page theme colour. These two cover the
         first paint from the system appearance; the app then narrows them to the resolved
         theme, which may differ from what the system asked for. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1b1d22" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="serverSENTINEL" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/logo-120.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>serverSENTINEL</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
