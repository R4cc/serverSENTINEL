name: ci

'on':
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

# Superseding a pull request commit leaves the previous run doing a full install, test,
# typecheck and Docker build for a commit nobody will merge. Push runs are never cancelled:
# they are the ones that publish tags, so a release must always be allowed to finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm run test

      - name: Read package version
        id: version
        run: node -e "console.log('value=' + require('./package.json').version)" >> "$GITHUB_OUTPUT"

      - name: Typecheck
        run: npm run typecheck

      - name: Install smoke browsers
        run: npx playwright install --with-deps chromium webkit

      # Keep this in the existing ci check so browser regressions block PRs and publishing.
      # The suite builds once and exercises the production UI against isolated demo servers.
      - name: Browser regression gate (loading, console continuity, mobile navigation)
        timeout-minutes: 15
        env:
          CONSOLE_LOADING_REPEATS: '1'
        run: npm run test:browser:ci

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set Docker tags
        id: meta
        if: github.event_name == 'push'
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            VERSION="${{ steps.version.outputs.value }}"
            echo "tags=nl2109/serversentinel:latest,nl2109/serversentinel:${VERSION},nl2109/serversentinel:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF_NAME}" = "dev" ]; then
            echo "tags=nl2109/serversentinel:dev,nl2109/serversentinel:dev-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "Unsupported branch: ${GITHUB_REF_NAME}"
            exit 1
          fi

      - name: Build Docker image
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            SS_BUILD_ID=${{ github.sha }}
            SS_VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
